name: Build & publish container

# Builds the self-contained pipeline image once and publishes it to:
#   - GitHub Container Registry  ghcr.io/pathogenomics-lab/bampiro   (always; via the ephemeral GITHUB_TOKEN)
#   - Docker Hub                 paururo/bampiro                     (only if the two secrets below are set)
# Runs on a version tag (`git tag 1.0.1 && git push --tags`, or a GitHub Release) or manually ("Run workflow").
#
# GHCR needs NO secret. Docker Hub is OPTIONAL - add these repository secrets to also push there
# (Settings -> Secrets and variables -> Actions); if they are absent the job just pushes to GHCR:
#   DOCKERHUB_USERNAME  - a Docker Hub account with push access to paururo/bampiro (i.e. paururo)
#   DOCKERHUB_TOKEN     - a Docker Hub access token (Account Settings -> Security -> New Access Token)
# Make whichever image the cluster pulls Public (Package settings / Docker Hub repo visibility).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish (e.g. 1.0.1). Also pushes :latest.'
        required: true
        default: '1.0.1'

env:
  IMAGE_NAME: ghcr.io/pathogenomics-lab/bampiro
  # The Dockerfile enforces linux/amd64; GitHub runners are x86_64 so this builds natively.
  PLATFORM: linux/amd64

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # lets the GITHUB_TOKEN push to ghcr.io for this repo's owner

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' }}   # push to Docker Hub only when the secret is set
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The image bundles a full conda env + the Zenodo panels + the H37Rv snpEff DB, so the
      # build is several GB. Reclaim the space the hosted runner wastes on preinstalled SDKs.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic per-run token, not a stored secret

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose target image list
        id: images
        run: |
          IMAGES="${IMAGE_NAME}"
          if [ "${DOCKERHUB_ENABLED}" = "true" ]; then IMAGES="${IMAGES}"$'\n'"paururo/bampiro"; fi
          { echo "list<<EOF"; printf '%s\n' "${IMAGES}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/dockerfile/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary (tags + digest to re-pin)
        run: |
          {
            echo "### 🐳 Pushed to GHCR$([ "${DOCKERHUB_ENABLED}" = "true" ] && echo " + Docker Hub")"
            echo ""
            echo "**Tags** (same manifest pushed to every image below)"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\` (identical on both registries)"
            echo ""
            echo "Pin it in \`nextflow.config\` for reproducible runs (use whichever registry the cluster can pull):"
            echo '```groovy'
            echo "container = \"docker://${IMAGE_NAME}@${{ steps.build.outputs.digest }}\""
            [ "${DOCKERHUB_ENABLED}" = "true" ] && echo "// or: container = \"docker://paururo/bampiro@${{ steps.build.outputs.digest }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
