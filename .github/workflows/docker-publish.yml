name: Build & publish container

# Builds the self-contained pipeline image and pushes it to Docker Hub (paururo/bampiro).
# Runs when a version tag is pushed (e.g. `git tag 1.0.1 && git push --tags`, which also
# happens when you create a GitHub Release), or manually via "Run workflow".
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - a Docker Hub account with push access to paururo/bampiro (i.e. paururo)
#   DOCKERHUB_TOKEN     - a Docker Hub access token (Account Settings -> Security -> New Access Token)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish (e.g. 1.0.1). Also pushes :latest.'
        required: true
        default: '1.0.1'

env:
  IMAGE_NAME: paururo/bampiro
  # The Dockerfile enforces linux/amd64; GitHub runners are x86_64 so this builds natively.
  PLATFORM: linux/amd64

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The image bundles a full conda env + the Zenodo panels + the H37Rv snpEff DB, so the
      # build is several GB. Reclaim the space the hosted runner wastes on preinstalled SDKs.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/dockerfile/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary (tags + digest to re-pin)
        run: |
          {
            echo "### 🐳 Pushed \`${IMAGE_NAME}\`"
            echo ""
            echo "**Tags**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin it in \`nextflow.config\` for reproducible runs:"
            echo '```groovy'
            echo "container = \"docker://${IMAGE_NAME}@${{ steps.build.outputs.digest }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
